[project]
name = "poker-mcp"
version = "0.1.0"
description = "MCP server wrapping the TexasSolver GTO poker engine, with inline 13x13 hand-grid rendering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
